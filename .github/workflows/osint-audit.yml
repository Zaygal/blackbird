# Authorised self-audit runner.
#
# Scope, stated so it cannot drift:
#   - PUBLIC data only. These tools query public profile pages and public
#     endpoints; they do not authenticate, bypass, or access anything private.
#   - Run it on YOURSELF, or on a documented public figure, or in support of a
#     request whose basis is recorded. Not on private individuals at will.
#   - A username match is NOT a person match. Two people share handles routinely.
#     Any output here is a lead to verify, never an attribution. Reports must
#     carry an explicit "not confidently attributed" section.
#   - No account creation, no impersonation, no sock-puppet tooling, no
#     subscriber or identity-database lookups.
#
# The workflow is dispatch-only on purpose: nothing runs on a push, so a fork of
# this repository cannot start probing targets on its own.

name: OSINT self-audit (blackbird)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Public handle to enumerate. Self-audit or documented basis only.'
        required: true
        default: 'p1ngul1n0'

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: What this CLI actually accepts
        run: python blackbird.py --help | head -60 || python blackbird.py -h | head -60

      - name: Enumerate
        run: |
          set -u
          echo "target: ${{ inputs.target }}"
          python blackbird.py --username "${{ inputs.target }}" --json --csv || true
          echo "== produced =="
          find . -maxdepth 2 -newermt '-10 minutes' -type f | head -30

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackbird-report
          path: |
            results_*
            *.json
            *.csv
            *.pdf
            *.html
          if-no-files-found: warn
